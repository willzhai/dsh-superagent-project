<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04070f" />
    <meta
      name="description"
      content="NEBULA // 待办终端：蓝黑科技感的本地待办应用，支持未办/已办分类与可选截止日期。"
    />
    <title>NEBULA // 待办终端</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050b18'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='none' stroke='%2338d6ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2338d6ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient__grid"></div>
      <div class="ambient__glow ambient__glow--one"></div>
      <div class="ambient__glow ambient__glow--two"></div>
      <div class="ambient__scan"></div>
    </div>

    <main class="app">
      <header class="masthead">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7dd3fc" />
                <stop offset="1" stop-color="#2563eb" />
              </linearGradient>
            </defs>
            <path
              d="M24 4 41 14v20L24 44 7 34V14Z"
              fill="none"
              stroke="url(#brand-gradient)"
              stroke-width="1.4"
            />
            <path
              d="M24 12 34 18v12l-10 6-10-6V18Z"
              fill="rgba(37, 99, 235, 0.12)"
              stroke="rgba(125, 211, 252, 0.45)"
              stroke-width="1"
            />
            <circle cx="24" cy="24" r="3.4" fill="#7dd3fc" />
            <path
              d="M24 17.4v3.4M24 27.2v3.4M17.4 21l2.9 1.7M27.7 25.3l2.9 1.7M17.4 27l2.9-1.7M27.7 22.7l2.9-1.7"
              stroke="rgba(125, 211, 252, 0.6)"
              stroke-width="1"
              stroke-linecap="round"
            />
          </svg>
          <div class="brand__text">
            <p class="brand__eyebrow">PERSONAL TASK CONSOLE</p>
            <h1 class="brand__title">
              <span class="brand__name">NEBULA</span>
              <span class="brand__slash" aria-hidden="true">//</span>
              <span class="brand__cn">待办终端</span>
            </h1>
          </div>
        </div>

        <div class="sys">
          <p class="sys__date" id="sys-date">0000.00.00 周一</p>
          <p class="sys__status"><span class="sys__dot" aria-hidden="true"></span> SYSTEM ONLINE</p>
        </div>
      </header>

      <section class="metrics" aria-label="任务概览">
        <div class="metric">
          <p class="metric__label">未办 <span>// PENDING</span></p>
          <p class="metric__value"><span id="stat-pending">00</span><span class="metric__unit">项</span></p>
        </div>
        <div class="metric">
          <p class="metric__label">已办 <span>// DONE</span></p>
          <p class="metric__value metric__value--done"><span id="stat-done">00</span><span class="metric__unit">项</span></p>
        </div>
        <div class="metric metric--progress">
          <div class="metric__row">
            <p class="metric__label">完成率 <span>// RATE</span></p>
            <p class="metric__percent" id="stat-rate">0%</p>
          </div>
          <div
            class="progress"
            id="progress"
            role="progressbar"
            aria-label="任务完成率"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span class="progress__bar" id="progress-bar"></span>
          </div>
        </div>
      </section>

      <section class="console panel" aria-label="新增待办">
        <form class="add" id="add-form" novalidate>
          <div class="field">
            <label for="task-title">新任务 <span class="field__en">// NEW TASK</span></label>
            <input
              id="task-title"
              name="title"
              type="text"
              maxlength="120"
              placeholder="输入待办事项，按 Enter 快速添加…"
              autocomplete="off"
              enterkeyhint="done"
              required
            />
          </div>
          <div class="field field--deadline">
            <label for="task-deadline">截止日期 <span class="field__en">// DEADLINE</span> <span class="field__optional">可选</span></label>
            <input id="task-deadline" name="deadline" type="date" />
          </div>
          <button class="btn-add" type="submit">
            <span class="btn-add__plus" aria-hidden="true">+</span>
            添加
          </button>
          <p class="form-error" id="form-error" role="alert" hidden></p>
        </form>
      </section>

      <section class="tasks panel" aria-label="任务列表">
        <div class="tabs">
          <div class="tabs__list" role="tablist" aria-label="任务分类">
            <button
              class="tab is-active"
              id="tab-pending"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="panel-tasks"
              data-tab="pending"
              tabindex="0"
            >
              未办 <span class="tab__en">PENDING</span> <span class="tab__count">00</span>
            </button>
            <button
              class="tab"
              id="tab-done"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="panel-tasks"
              data-tab="done"
              tabindex="-1"
            >
              已办 <span class="tab__en">DONE</span> <span class="tab__count">00</span>
            </button>
          </div>
          <span class="tabs__hint" aria-hidden="true">◈ LOCAL STORAGE</span>
        </div>

        <div class="panel-body" id="panel-tasks" role="tabpanel" aria-labelledby="tab-pending">
          <ul class="task-list" id="task-list"></ul>
          <div class="empty" id="empty-state" hidden>
            <svg class="empty__icon" viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="32" r="17" fill="none" stroke="currentColor" stroke-opacity="0.32" />
              <ellipse
                cx="32"
                cy="32"
                rx="27"
                ry="9"
                fill="none"
                stroke="currentColor"
                stroke-opacity="0.2"
                transform="rotate(-24 32 32)"
              />
              <circle cx="32" cy="32" r="3" fill="currentColor" />
              <circle cx="51" cy="20" r="1.6" fill="currentColor" opacity="0.8" />
            </svg>
            <p class="empty__title" id="empty-title">暂无待办任务</p>
            <p class="empty__desc" id="empty-desc">在上方输入任务，按 Enter 即可创建。</p>
          </div>
        </div>
      </section>

      <footer class="footer">
        <p>NEBULA TASK CONSOLE <span class="footer__dim">v1.0</span></p>
        <p class="footer__hint">ENTER 添加 · SPACE 完成</p>
        <p class="footer__note" id="storage-note">LOCAL STORAGE // 数据仅保存在本机浏览器</p>
      </footer>

      <p class="sr-only" id="live" aria-live="polite"></p>
    </main>

    <template id="task-template">
      <li class="task">
        <label class="task__check">
          <input type="checkbox" />
          <span class="task__box" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M3.6 8.3 6.5 11.2 12.4 5" /></svg>
          </span>
        </label>
        <div class="task__body">
          <p class="task__title"></p>
          <p class="task__meta">
            <time class="task__deadline" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="5.6" />
                <path d="M8 4.7V8l2.2 1.4" />
              </svg>
              <span class="task__deadline-text"></span>
            </time>
          </p>
        </div>
        <button class="task__delete" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
        </button>
      </li>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
